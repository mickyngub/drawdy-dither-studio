<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Dither Studio webview smoke test</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 12px;
                display: flex;
                height: 100vh;
            }
            #host {
                flex: 1;
                min-width: 0;
                border: 0;
                border-right: 1px solid #ddd;
            }
            #side {
                width: 380px;
                flex: none;
                padding: 10px;
                overflow: auto;
                background: #fafafa;
            }
            #log {
                white-space: pre-wrap;
                word-break: break-all;
                margin: 0;
                font-size: 11px;
            }
            h1 {
                font-size: 12px;
                margin: 0 0 8px;
            }
            body.drawer #host {
                flex: none;
                width: 430px;
                border-right: 0;
            }
            body.drawer #side {
                display: none;
            }
        </style>
    </head>
    <body>
        <iframe id="host"></iframe>
        <div id="side">
            <h1>driver stub log</h1>
            <pre id="log"></pre>
        </div>
        <script>
            if (location.search.includes("drawer")) document.body.classList.add("drawer");
            const log = document.getElementById("log");
            const write = (line) => {
                log.textContent += line + "\n";
            };

            window.__driverLog = [];
            window.__lastPlace = null;

            function sourceCanvas() {
                const c = document.createElement("canvas");
                c.width = 300;
                c.height = 200;
                const g = c.getContext("2d");
                g.fillStyle = "#ffffff";
                g.fillRect(0, 0, 300, 200);
                const grad = g.createRadialGradient(150, 100, 8, 150, 100, 110);
                grad.addColorStop(0, "#101018");
                grad.addColorStop(0.55, "#7a7a92");
                grad.addColorStop(1, "#ffffff");
                g.fillStyle = grad;
                g.fillRect(0, 0, 300, 200);
                return c;
            }

            function sourceBlob() {
                return new Promise((resolve) =>
                    sourceCanvas().toBlob(resolve, "image/png")
                );
            }

            let listener = null;

            window.__stub = function acquireDrawdyApi() {
                return {
                    postMessage(message) {
                        window.__driverLog.push(message);
                        if (message && message.type === "place") {
                            window.__lastPlace = {
                                mode: message.mode,
                                pixelWidth: message.pixelWidth,
                                pixelHeight: message.pixelHeight,
                                dataUrlPrefix: String(
                                    message.dataUrl
                                ).slice(0, 22),
                                dataUrlLength: String(message.dataUrl).length,
                            };
                            write(
                                "place " + JSON.stringify(window.__lastPlace)
                            );
                            return;
                        }
                        if (message && message.type === "params") {
                            write("params (debounced snapshot)");
                            return;
                        }
                        write(JSON.stringify(message));
                        if (message && message.type === "ready") {
                            listener &&
                                listener({ type: "init", params: undefined });
                            write("-> sent init");
                            void sourceBlob().then((png) => {
                                listener &&
                                    listener({
                                        type: "source",
                                        png,
                                        sourceIds: ["stub-element"],
                                        rect: {
                                            x: 0,
                                            y: 0,
                                            width: 300,
                                            height: 200,
                                        },
                                    });
                                write("-> sent source (300x200 png blob)");
                            });
                        }
                    },
                    onMessage(cb) {
                        listener = cb;
                        return () => {
                            listener = null;
                        };
                    },
                };
            };

            const INJECT =
                "<script>window.acquireDrawdyApi = parent.__stub;<\/script>";

            void fetch("../dist/webview-standalone.html")
                .then((r) => r.text())
                .then((html) => {
                    document.getElementById("host").srcdoc = html.replace(
                        "<body>",
                        "<body>" + INJECT
                    );
                })
                .catch((err) => write("load failed: " + err.message));
        </script>
    </body>
</html>
